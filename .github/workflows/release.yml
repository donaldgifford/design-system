---
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: bun node

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # With changesets pending this opens or updates the "version packages"
      # pull request. With none pending it publishes any version not yet on
      # the registry and creates the GitHub Release.
      - name: Create the version PR or publish
        uses: changesets/action@v2
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
