---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    name: Label PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint code and config
        run: just lint

      - name: Lint Markdown
        run: just lint-md

      - name: Lint YAML
        run: just lint-yaml

      - name: Lint workflows
        run: just lint-actions

      - name: Validate docs
        run: just docs-validate

  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: bun node just

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: bun node just

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: just storybook-build
